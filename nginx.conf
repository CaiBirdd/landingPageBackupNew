# User-Agent 黑白名单检测
# 使用 map 指令在 http 块中定义，性能更好
map $http_user_agent $blocked_agent {
    default 0;

    # === 白名单：Facebook 爬虫（优先级最高，必须设置为 0）===
    ~*facebookexternalhit 0;
    ~*facebot 0;
    ~*facebook 0;
    ~*facebookcatalog 0;

    # === 白名单：正常浏览器 ===
    ~*mozilla 0;
    ~*chrome 0;
    ~*safari 0;
    ~*firefox 0;
    ~*edge 0;
    ~*opera 0;

    # === 黑名单：搜索引擎爬虫 ===
    ~*googlebot 1;
    ~*google-inspectiontool 1;
    ~*adsbot-google 1;
    ~*mediapartners-google 1;
    ~*bingbot 1;
    ~*bingpreview 1;
    ~*msnbot 1;
    ~*baiduspider 1;
    ~*yandexbot 1;
    ~*slurp 1;
    ~*duckduckbot 1;
    ~*sogou 1;
    ~*360spider 1;

    # === 黑名单：SEO 工具和爬虫 ===
    ~*semrushbot 1;
    ~*ahrefsbot 1;
    ~*mj12bot 1;
    ~*dotbot 1;
    ~*rogerbot 1;
    ~*exabot 1;
    ~*screaming 1;

    # === 黑名单：常见恶意爬虫工具 ===
    ~*python-requests 1;
    ~*scrapy 1;
    ~*curl 1;
    ~*wget 1;
    ~*httpie 1;
    ~*httrack 1;
    ~*teleport 1;
    ~*webcopier 1;
    ~*nmap 1;
    ~*nikto 1;
    ~*sqlmap 1;
}

# 空 User-Agent 检测
map $http_user_agent $empty_ua {
    default 0;
    "" 1;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # === 防爬虫规则：阻止黑名单 User-Agent ===
    if ($blocked_agent = 1) {
        return 403;
    }

    # === 防爬虫规则：阻止空 User-Agent ===
    if ($empty_ua = 1) {
        return 403;
    }

    # Gzip 压缩配置
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # robots.txt 单独处理（确保可访问）
    location = /robots.txt {
        root /usr/share/nginx/html;
        access_log off;
    }

    # 处理 Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存配置
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

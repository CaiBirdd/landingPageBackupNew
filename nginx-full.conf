user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # === User-Agent 黑白名单检测（必须在 http 块中定义）===
    # 注意：map 匹配顺序很重要！先匹配的规则优先生效
    map $http_user_agent $blocked_agent {
        default 0;

        # === 黑名单：搜索引擎爬虫（优先级最高，必须在浏览器白名单之前）===
        ~*googlebot 1;
        ~*google-inspectiontool 1;
        ~*adsbot-google 1;
        ~*mediapartners-google 1;
        ~*bingbot 1;
        ~*bingpreview 1;
        ~*msnbot 1;
        ~*baiduspider 1;
        ~*yandexbot 1;
        ~*slurp 1;
        ~*duckduckbot 1;
        ~*sogou 1;
        ~*360spider 1;

        # === 黑名单：SEO 工具和爬虫 ===
        ~*semrushbot 1;
        ~*ahrefsbot 1;
        ~*mj12bot 1;
        ~*dotbot 1;
        ~*rogerbot 1;
        ~*exabot 1;
        ~*screaming 1;

        # === 黑名单：常见恶意爬虫工具 ===
        ~*python-requests 1;
        ~*scrapy 1;
        ~*wget 1;
        ~*httpie 1;
        ~*httrack 1;
        ~*teleport 1;
        ~*webcopier 1;
        ~*nmap 1;
        ~*nikto 1;
        ~*sqlmap 1;

        # === 白名单：Facebook 爬虫 ===
        ~*facebookexternalhit 0;
        ~*facebot 0;
        ~*facebookcatalog 0;

        # === 白名单：正常浏览器（放在最后）===
        ~*mozilla 0;
        ~*chrome 0;
        ~*safari 0;
        ~*firefox 0;
        ~*edge 0;
        ~*opera 0;
    }

    # 空 User-Agent 检测
    map $http_user_agent $empty_ua {
        default 0;
        "" 1;
    }

    # robots.txt 请求检测（用于排除防爬虫规则）
    map $request_uri $is_robots {
        default 0;
        /robots.txt 1;
    }

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Gzip 压缩配置
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_vary on;

        # robots.txt 单独处理（不受防爬虫规则影响）
        location = /robots.txt {
            root /usr/share/nginx/html;
            access_log off;
        }

        # === 防爬虫规则：阻止黑名单 User-Agent（排除 robots.txt）===
        if ($is_robots = 0) {
            set $check_ua "${blocked_agent}${empty_ua}";
        }

        if ($check_ua = "10") {
            return 403;
        }

        if ($check_ua = "01") {
            return 403;
        }

        if ($check_ua = "11") {
            return 403;
        }

        # 处理 Vue Router history 模式
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 静态资源缓存配置
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
